spring.application.name=msvc-orders
server.port=8006

spring.datasource.url=jdbc:h2:file:./data/ordenes
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Consola de administración de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Registro en Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# CLAVE SECRETA JWT: debe ser EXACTAMENTE la misma en gateway y microservicios
jwt.secret=clave-secreta-super-segura-para-jwt-gamehub-msvc-duoc-2026-0616
jwt.expiration-minutes=60
